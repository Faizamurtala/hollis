name: hollis-poll

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes, UTC. GitHub may delay this under load - that's normal.
  workflow_dispatch: {}       # lets you also trigger a run manually from the Actions tab

permissions:
  contents: write            # needed so the workflow can commit the updated logs back to the repo

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node (for the bgc CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bitget Agent Hub CLI
        run: |
          # Replace with the actual install command from
          # github.com/BitgetLimited/agent_hub once you've confirmed it
          npm install -g bitget-agent-hub || echo "adjust this install step to match the real package name"

      - name: Run one HOLLIS evaluation pass
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BITGET_QWEN_API_KEY: ${{ secrets.BITGET_QWEN_API_KEY }}
          BITGET_AGENTIC_ACCOUNT_TOKEN: ${{ secrets.BITGET_AGENTIC_ACCOUNT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_once_action.py

      - name: Commit updated logs back to the repo
        run: |
          git config user.name "hollis-bot"
          git config user.email "hollis-bot@users.noreply.github.com"
             git add logs/
          git diff --quiet --cached || git commit -m "hollis: poll $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
